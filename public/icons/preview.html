<!DOCTYPE html>
<html>
<head>
  <title>Taskflow Icons Preview</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 40px; }
    h1 { color: #22c55e; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: 800px; margin: 0 auto; }
    .icon-card { background: white; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .icon-card img { width: 80px; height: 80px; margin-bottom: 12px; }
    .icon-card p { margin: 0; color: #666; font-weight: 500; text-transform: capitalize; }
  </style>
</head>
<body>
  <h1>⚡ Taskflow Icons</h1>
  <div class="grid">
    <div class="icon-card"><img src="work.svg"><p>Work</p></div>
    <div class="icon-card"><img src="personal.svg"><p>Personal</p></div>
    <div class="icon-card"><img src="health.svg"><p>Health</p></div>
    <div class="icon-card"><img src="finance.svg"><p>Finance</p></div>
    <div class="icon-card"><img src="home.svg"><p>Home</p></div>
    <div class="icon-card"><img src="social.svg"><p>Social</p></div>
    <div class="icon-card"><img src="learning.svg"><p>Learning</p></div>
    <div class="icon-card"><img src="errands.svg"><p>Errands</p></div>
  </div>
</body>
</html>
